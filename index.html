<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="GTS.css">
    <title>Guess The Song</title>
</head>

<body>
    <main id="gameContainer">
        <h1>RetroBeats</h1>

        <input id="genreSelector" type="text" placeholder="type a genre (e.g. pop, rock, salsa)">

        <button id="play">Start</button>

        <div id="gameZone" style="display: none;">
            <div class="audio-row">
                <button id="replayBtn">▶</button>
                <progress id="progressBar" value="0" max="30"></progress>
            </div>

            <p id="timeCounter" style="margin-top: 5px; font-family: monospace;">0.0s / 30s</p>

            <p id="marcador"><b>SCORE: 00000</b></p>

            <input id="guess" type="text" list="suggestion" placeholder="guess the name of the song">
            <div id="customSuggestions" class="suggestions-box"></div>
            
            <button id="check">try</button>
            <br><button id="next">next song</button>
            <p id="feedback"></p>
            <p id="hearts"></p>
        </div>

    </main>
    <script src="audioGTS.js"></script>
    <script src="GTS.js"></script>
</body>

</html>
